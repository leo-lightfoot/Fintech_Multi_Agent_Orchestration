version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: orchestrator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build: .
    container_name: fintech-agent-orchestrator
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-6}
      - API_SECRET_KEY=${API_SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DOCS_PATH=/app/data/docs
      - VECTOR_STORE_PATH=/app/data/chroma
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

volumes:
  redis-data:
